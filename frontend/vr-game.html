<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VR互动 · 面塑凤凰 — 指间塑</title>
  <link rel="stylesheet" href="css/style.css?v=20261117c">
  <link rel="stylesheet" href="css/vr-game.css?v=20261125b">
</head>
<body class="vr-game-body">
  <div id="game" class="game-root">
    <canvas id="vr-canvas"></canvas>

    <!-- 顶部 bar -->
    <header class="game-topbar">
      <a href="vr.html" class="game-back" title="返回 VR互动">← 返回</a>
      <div class="game-title">面塑凤凰 · 八法匠心</div>
      <div class="game-topbar-actions">
        <button type="button" id="btn-look" class="game-icon-btn" title="环视全景（也可按住右键拖动）" aria-label="环视全景" aria-pressed="false">👁</button>
        <button type="button" id="btn-sound" class="game-icon-btn" title="音效开关" aria-label="音效开关">🔊</button>
        <button type="button" id="btn-fullscreen" class="game-icon-btn" title="全屏" aria-label="全屏">⛶</button>
      </div>
    </header>

    <!-- 老奶奶教学气泡 -->
    <div id="coach" class="coach hidden" aria-live="polite">
      <div class="coach-avatar" aria-hidden="true">👵</div>
      <div class="coach-body">
        <div class="coach-name">面塑奶奶</div>
        <div id="coach-text" class="coach-text"></div>
      </div>
    </div>

    <!-- 手法提示：掤捋挤按采挒肘靠 -->
    <div class="technique-bar" id="technique-bar" aria-label="太极八法步骤">
      <button type="button" class="tech-step" data-step="0" title="掤：托起面团"><span class="tech-zi">掤</span><span class="tech-label">起面</span></button>
      <button type="button" class="tech-step" data-step="1" title="捋：揉圆面团"><span class="tech-zi">捋</span><span class="tech-label">揉圆</span></button>
      <button type="button" class="tech-step" data-step="2" title="挤：挤出凤凰身形"><span class="tech-zi">挤</span><span class="tech-label">塑身</span></button>
      <button type="button" class="tech-step" data-step="3" title="按：按压贴合装饰"><span class="tech-zi">按</span><span class="tech-label">贴饰</span></button>
      <button type="button" class="tech-step" data-step="4" title="采：采放黑豆点睛"><span class="tech-zi">采</span><span class="tech-label">点睛</span></button>
      <button type="button" class="tech-step" data-step="5" title="挒：挒出花形尾羽"><span class="tech-zi">挒</span><span class="tech-label">制尾</span></button>
      <button type="button" class="tech-step" data-step="6" title="肘：合拢三尾"><span class="tech-zi">肘</span><span class="tech-label">合尾</span></button>
      <button type="button" class="tech-step" data-step="7" title="靠：整体组装成凤凰"><span class="tech-zi">靠</span><span class="tech-label">成凤</span></button>
    </div>

    <!-- 当前任务卡 -->
    <div id="task-card" class="task-card hidden">
      <div class="task-head">
        <span id="task-tech" class="task-tech">掤</span>
        <div>
          <div id="task-title" class="task-title">托起面团</div>
          <div id="task-desc" class="task-desc">按住鼠标左键向上拖动，感受面团在掌心成形</div>
        </div>
      </div>
      <div class="task-progress"><div id="task-progress-fill" class="task-progress-fill"></div></div>
    </div>

    <!-- 交互光标提示 -->
    <div id="hand-hint" class="hand-hint hidden">按住鼠标左键，按提示方向拖动 <span class="hand-arrow">↕</span></div>

    <!-- 环视提示：开启环视模式时出现 -->
    <div id="look-hint" class="look-hint hidden">环视中 · 拖动画面看四周</div>

    <!-- 开场剧情：奶奶说明 → 书记创意 → 开始游戏（按钮已画在画面里，整幅画面可点） -->
    <div id="start-overlay" class="overlay story-overlay">
      <div class="story-stage" id="story-stage">
        <img id="story-img" class="story-img" src="images/story-1.jpg" alt="花饽饽店的新故事：奶奶向书记说明店里最近的情况" draggable="false">

        <!-- 前两段点「下一段」推进；第三段换成「开始游戏」，走 vr-game.js 原有启动逻辑 -->
        <button type="button" id="btn-story-next" class="story-hit" aria-label="下一段"></button>
        <button type="button" id="btn-start" class="story-hit hidden" aria-label="开始游戏"></button>

        <button type="button" id="story-audio-pill" class="story-audio-pill hidden">🔊 点击播放语音</button>
      </div>

      <div class="story-hud">
        <div class="story-dots" id="story-dots" aria-hidden="true"><i class="is-on"></i><i></i><i></i></div>
        <button type="button" id="btn-story-skip" class="story-skip">跳过剧情 ›</button>
      </div>

      <p class="story-rotate-hint" aria-hidden="true">↻ 横过手机，看得更清楚</p>

      <audio id="story-audio" preload="auto" playsinline></audio>
    </div>

    <!-- 完成遮罩 -->
    <div id="finish-overlay" class="overlay hidden">
      <div class="overlay-card finish-card">
        <div class="overlay-eyebrow">作品完成</div>
        <h1 class="overlay-title">凤凰涅槃<br><span>指尖生花</span></h1>
        <p class="overlay-desc">八法皆到位，三尾已成形。你的面塑凤凰出炉了！拖动鼠标可以360°欣赏你的作品。</p>
        <div class="finish-actions">
          <button type="button" id="btn-again" class="btn btn-primary">再捏一次</button>
          <a href="vr.html" class="btn btn-outline">返回 VR互动</a>
        </div>
      </div>
    </div>

    <!-- 加载提示 -->
    <div id="model-loading" class="model-loading hidden">正在准备 3D 场景…</div>
    <div id="fallback-notice" class="fallback-notice hidden"></div>
  </div>

  <script src="js/site-base.js"></script>
  <script src="js/vr-story.js?v=20261125a" defer></script>
  <script src="vendor/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="js/vr-game.js?v=20261125b"></script>
</body>
</html>
